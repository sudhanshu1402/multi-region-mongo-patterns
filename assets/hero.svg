<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="multi-region-mongo-patterns: a giant 409, what a write gets when its region breaks the tenant&#x27;s residency. Nothing is stored. Shard key region then tenantId, zones EU Frankfurt, USA Virginia, KSA Riyadh. Atlas zone sharding for GDPR and PDPL, a reference implementation." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.mo{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}.sa{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}.se{font-family:Georgia,"Times New Roman",serif}.bl{font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif}
.in{}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.dr{}@keyframes dr{to{stroke-dashoffset:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style>
<rect width="1200" height="500" fill="#fafaf7"/><g stroke="#e8e6df"><line x1="300" x2="300" y1="0" y2="500"/><line x1="600" x2="600" y1="0" y2="500"/><line x1="900" x2="900" y1="0" y2="500"/></g>
<text x="30" y="400" class="sa in" font-size="330" font-weight="700" letter-spacing="-22" fill="#111">409</text>
<circle cx="628" cy="92" r="16" fill="#e63312"/>
<g class="sa in" style="animation-delay:0.5s"><text x="660" y="90" font-size="16" font-weight="700" fill="#111">What a write gets when its region</text><text x="660" y="112" font-size="16" font-weight="700" fill="#111">breaks the tenant's residency.</text><text x="660" y="136" font-size="15" fill="#555">Nothing is stored.</text></g>
<g class="sa in" style="animation-delay:0.9s" font-size="14"><text x="660" y="250" font-weight="700" fill="#111">Shard key</text><text x="660" y="272" class="mo" fill="#555">{ region, tenantId }</text>
<text x="920" y="250" font-weight="700" fill="#111">Zones</text><text x="920" y="272" fill="#555">EU Frankfurt</text><text x="920" y="292" fill="#555">USA Virginia</text><text x="920" y="312" fill="#555">KSA Riyadh</text>
<text x="660" y="370" font-weight="700" fill="#111">multi-region-mongo-patterns</text><text x="660" y="392" fill="#555">Atlas zone sharding, GDPR and PDPL</text>
<text x="920" y="370" font-weight="700" fill="#111">Status</text><text x="920" y="392" fill="#e63312">reference implementation</text></g></svg>