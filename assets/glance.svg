<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="multi-region-mongo-patterns at a glance: zone sharding, region leads the shard key or every read scatters, a residency mismatch returns 409, 30 tests verified offline with no cluster needed">
  <rect width="880" height="150" rx="10" fill="#0d1117" stroke="#30363d"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="20" y="30" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="36" y="56" fill="#7d8590" font-size="11" letter-spacing="1">PATTERN</text>
    <text x="36" y="82" fill="#e6edf3" font-size="16" font-weight="600">zone sharding</text>
    <text x="36" y="106" fill="#7d8590" font-size="12">one string, 3 real zones</text>
    <rect x="235" y="30" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="251" y="56" fill="#7d8590" font-size="11" letter-spacing="1">SHARD KEY</text>
    <text x="251" y="82" fill="#58a6ff" font-size="16" font-weight="600">region first</text>
    <text x="251" y="106" fill="#7d8590" font-size="12">else every read scatters</text>
    <rect x="450" y="30" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="466" y="56" fill="#7d8590" font-size="11" letter-spacing="1">RESIDENCY</text>
    <text x="466" y="82" fill="#f85149" font-size="16" font-weight="600">409</text>
    <text x="466" y="106" fill="#7d8590" font-size="12">zone mismatch rejected</text>
    <rect x="665" y="30" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="681" y="56" fill="#7d8590" font-size="11" letter-spacing="1">VERIFIED</text>
    <text x="681" y="82" fill="#3fb950" font-size="16" font-weight="600">30 tests</text>
    <text x="681" y="106" fill="#7d8590" font-size="12">offline, no cluster</text>
  </g>
</svg>
